# Local build override: builds the release images from this checkout.
#
# Usage:
# docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# Or set an alias / shell function:
# alias dc-build='docker compose -f docker-compose.yml -f docker-compose.build.yml'
# dc-build up --build

x-backend-build: &backend-build
  build:
    context: .
    dockerfile: Dockerfile
    target: production

x-agent-build: &agent-build
  build:
    context: .
    dockerfile: agent/Dockerfile
    args:
      # The workflow Agent is intentionally self-contained: Chromium, noVNC,
      # Browser Bridge, and agent_server share one persistent profile.
      INSTALL_CHROME: ${INSTALL_CHROME:-true}
      BBX_VERSION: ${BBX_VERSION:-1.11.1}
      BROWSER_ENGINE: ${BROWSER_ENGINE-chromium}
      CLOAKBROWSER_VERSION: ${CLOAKBROWSER_VERSION:-0.5.10}

x-chrome-build: &chrome-build
  build:
    context: .
    dockerfile: chrome/Dockerfile
    args:
      BROWSER_ENGINE: ${BROWSER_ENGINE-chromium}
      CLOAKBROWSER_VERSION: ${CLOAKBROWSER_VERSION:-0.5.10}

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://api:8000
        NEXT_PUBLIC_API_AUTH_TOKEN: ${API_AUTH_TOKEN:?Set API_AUTH_TOKEN in .env or run scripts/install.sh}
        NEXT_PUBLIC_ENABLE_VERCEL_ANALYTICS: ${NEXT_PUBLIC_ENABLE_VERCEL_ANALYTICS:-}
        NEXT_PUBLIC_YJS_URL: ${NEXT_PUBLIC_YJS_URL:-ws://127.0.0.1:1234}

  api:
    <<: *backend-build

  collaboration:
    build:
      context: ./collaboration
      dockerfile: Dockerfile

  worker:
    <<: *backend-build

  beat:
    <<: *backend-build

  agent-1:
    <<: *agent-build
    volumes:
      - agent_profile_1:/home/agent/.config/chromium
  # Remote edge agent: same image, same default (no embedded Chrome).
  agent:
    <<: *agent-build
